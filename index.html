<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MLB BOT</title>
<script src="https://telegram.org/js/telegram-web-app.js">
// -- FUTBOL -------------------------------------------------------------

var soccerData = null;
var selectedFutbolLiga = 'todas';
var selectedFutbolSenal = 'todas';

function selectMainTab(tab) {
  var beisbolPanel = document.getElementById('beisbol-panel');
  var futbolPanel = document.getElementById('futbol-panel');
  var tabBeisbol = document.getElementById('tab-beisbol');
  var tabFutbol = document.getElementById('tab-futbol');
  if (tab === 'beisbol') {
    beisbolPanel.style.display = '';
    futbolPanel.style.display = 'none';
    tabBeisbol.className = 'main-tab active';
    tabFutbol.className = 'main-tab';
  } else {
    beisbolPanel.style.display = 'none';
    futbolPanel.style.display = '';
    tabBeisbol.className = 'main-tab';
    tabFutbol.className = 'main-tab active futbol';
    if (!soccerData) fetchSoccerData();
  }
}

function fetchSoccerData() {
  fetch('soccer_data.json?t=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(data) {
      soccerData = data;
      renderFutbol();
    })
    .catch(function() {
      document.getElementById('futbol-games-list').innerHTML = '<div class="futbol-empty">Sin datos de futbol disponibles</div>';
    });
}

function selectFutbolLiga(liga) {
  selectedFutbolLiga = liga;
  var btns = document.querySelectorAll('#futbol-panel .futbol-filter-row:first-child .futbol-filter-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].className = 'futbol-filter-btn' + (btns[i].getAttribute('onclick').includes("'" + liga + "'") ? ' active' : '');
  }
  renderFutbol();
}

function selectFutbolSenal(senal) {
  selectedFutbolSenal = senal;
  var btns = document.querySelectorAll('#futbol-panel .futbol-filter-row:nth-child(3) .futbol-filter-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].className = 'futbol-filter-btn' + (btns[i].getAttribute('onclick').includes("'" + senal + "'") ? ' active' : '');
  }
  renderFutbol();
}

function renderFutbol() {
  if (!soccerData) return;
  var info = document.getElementById('futbol-update-info');
  if (info) info.textContent = 'Actualizado: ' + (soccerData.fecha || '') + ' - ' + (soccerData.games ? soccerData.games.length : 0) + ' partidos';
  renderFutbolGames();
  renderFutbolStats();
}

function renderFutbolGames() {
  var container = document.getElementById('futbol-games-list');
  var games = soccerData.games || [];
  var filtered = games.filter(function(g) {
    if (selectedFutbolLiga !== 'todas' && g.liga_key !== selectedFutbolLiga) return false;
    if (selectedFutbolSenal === 'ah0') return g.senal_ah0 && g.senal_ah0 !== 'NO_APOSTAR';
    if (selectedFutbolSenal === 'ou25') return g.senal_ou25 && g.senal_ou25 !== 'NO_APOSTAR';
    return true;
  });
  if (filtered.length === 0) {
    container.innerHTML = '<div class="futbol-empty">Sin partidos con estos filtros</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < filtered.length; i++) {
    var g = filtered[i];
    var senalHtml = '';
    if (g.senal_ah0 && g.senal_ah0 !== 'NO_APOSTAR') {
      var cls = g.confianza_ah0 === 'ALTA' ? 'alta' : (g.confianza_ah0 === 'MEDIA' ? 'media' : 'baja');
      senalHtml += '<span class="senal-tag ah0">AH0</span><span class="confianza ' + cls + '">' + g.confianza_ah0 + '</span> ';
    }
    if (g.senal_ou25 && g.senal_ou25 !== 'NO_APOSTAR') {
      var cls = g.confianza_ou25 === 'ALTA' ? 'alta' : (g.confianza_ou25 === 'MEDIA' ? 'media' : 'baja');
      senalHtml += '<span class="senal-tag ou25">O/U 2.5</span><span class="confianza ' + cls + '">' + g.confianza_ou25 + '</span>';
    }
    if (!senalHtml) {
      senalHtml = '<span class="senal-tag no-apostar">No apostar</span>';
    }
    var favText = g.favorito ? ' - ' + g.favorito : '';
    html += '<div class="futbol-game-row">'
      + '<div><div class="futbol-teams">' + g.local + ' vs ' + g.visitante + favText + '</div>'
      + '<div class="futbol-xg">xG: ' + g.xg_local.toFixed(1) + ' - ' + g.xg_visit.toFixed(1) + ' | Total: ' + g.xg_total.toFixed(1) + ' | Diff: ' + (g.diff_xg >= 0 ? '+' : '') + g.diff_xg.toFixed(2) + '</div></div>'
      + '<div class="futbol-signal">' + senalHtml + '</div>'
      + '</div>';
  }
  container.innerHTML = html;
}

function renderFutbolStats() {
  var container = document.getElementById('futbol-stats-list');
  var stats = (soccerData && soccerData.stats) || {};
  var items = [
    { label: 'Global AH0', total: stats.ah0_total, ok: stats.ah0_acertados, fail: stats.ah0_fallidos, rate: stats.ah0_win_rate },
    { label: 'Global O/U 2.5', total: stats.ou25_total, ok: stats.ou25_acertados, fail: stats.ou25_fallidos, rate: stats.ou25_win_rate },
    { label: 'Premier League AH0', key: 'premier_ah0', total: stats.premier_ah0_total, ok: stats.premier_ah0_acertados, fail: stats.premier_ah0_fallidos, rate: stats.premier_ah0_win_rate },
    { label: 'Premier League O/U 2.5', key: 'premier_ou25', total: stats.premier_ou25_total, ok: stats.premier_ou25_acertados, fail: stats.premier_ou25_fallidos, rate: stats.premier_ou25_win_rate },
    { label: 'La Liga AH0', key: 'laliga_ah0', total: stats.laliga_ah0_total, ok: stats.laliga_ah0_acertados, fail: stats.laliga_ah0_fallidos, rate: stats.laliga_ah0_win_rate },
    { label: 'La Liga O/U 2.5', key: 'laliga_ou25', total: stats.laliga_ou25_total, ok: stats.laliga_ou25_acertados, fail: stats.laliga_ou25_fallidos, rate: stats.laliga_ou25_win_rate },
    { label: 'Liga MX AH0', key: 'ligamx_ah0', total: stats.ligamx_ah0_total, ok: stats.ligamx_ah0_acertados, fail: stats.ligamx_ah0_fallidos, rate: stats.ligamx_ah0_win_rate },
    { label: 'Liga MX O/U 2.5', key: 'ligamx_ou25', total: stats.ligamx_ou25_total, ok: stats.ligamx_ou25_acertados, fail: stats.ligamx_ou25_fallidos, rate: stats.ligamx_ou25_win_rate },
  ];
  var html = '';
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    if (it.total === null || it.total === undefined) continue;
    if (it.rate !== undefined) {
      html += '<div class="futbol-stat-item"><span class="futbol-stat-label">' + it.label + '</span><span class="futbol-stat-value">' + (it.ok || 0) + 'E ' + (it.fail || 0) + 'F <span class="futbol-stat-sub">(' + it.total + ') ' + it.rate + '%</span></span></div>';
    } else if (it.total > 0) {
      if (it.ok !== undefined) {
        html += '<div class="futbol-stat-item"><span class="futbol-stat-label">' + it.label + '</span><span class="futbol-stat-value">' + (it.ok || 0) + 'E ' + (it.fail || 0) + 'F <span class="futbol-stat-sub">(' + it.total + ')</span></span></div>';
      }
    }
  }
  if (!html) html = '<div class="futbol-empty">No hay estadisticas de futbol aun. Los datos se acumularan cuando los partidos tengan resultados.</div>';
  container.innerHTML = html;
}

  // Preload soccer data
  fetchSoccerData();</script>
