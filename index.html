<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MLB BOT</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f1419; color: #e1e8ed;
    padding: 16px; min-height: 100vh;
  }
  .header {
    text-align: center; padding: 16px 0 8px;
  }
  .header h1 {
    font-size: 20px; font-weight: 700;
    background: linear-gradient(135deg, #1d9bf0, #8b5cf6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .header .date { font-size: 13px; color: #71767b; margin-top: 4px; }
  .legend {
    display: flex; flex-wrap: wrap; gap: 6px;
    justify-content: center; margin: 12px 0;
    font-size: 12px; color: #71767b;
  }
  .legend span { display: inline-flex; align-items: center; gap: 3px; }

  .card {
    background: #1a1f2e; border-radius: 12px;
    padding: 12px; margin-bottom: 12px;
    border: 1px solid #2a3040;
  }
  .card-title {
    font-size: 13px; font-weight: 600; color: #e1e8ed;
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 10px;
  }

  .game-row {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 6px;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid #2a3040;
    font-size: 12px;
  }
  .game-row:last-child { border-bottom: none; }
  .game-status {
    width: 20px; text-align: center; font-size: 13px;
  }
  .game-team { font-weight: 500; color: #e1e8ed; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .game-state {
    font-size: 12px; color: #71767b;
    background: #262d3d; padding: 2px 8px;
    border-radius: 6px; text-align: center;
  }

  .stat-grid {
    display: grid; gap: 10px;
  }
  .stat-item {
    display: flex; justify-content: space-between;
    align-items: center; padding: 6px 0;
    border-bottom: 1px solid #2a3040;
  }
  .stat-item:last-child { border-bottom: none; }
  .stat-label { font-size: 14px; color: #e1e8ed; }
  .stat-value { font-size: 14px; font-weight: 600; }
  .stat-value .winrate { color: #00ba7c; }
  .stat-value .fire { margin-left: 4px; }
  .stat-sub {
    font-size: 12px; color: #8b98a5;
    margin-left: 8px;
  }



  .footer {
    text-align: center; padding: 16px 0;
    font-size: 12px; color: #e1e8ed;
  }
</style>
</head>
<body>

<div class="header">
  <h1>⚾ MLB BOT</h1>
  <div class="date" id="fecha">—</div>
</div>

<div class="legend">
  <span>✅ Acertado</span>
  <span>❌ Fallido</span>
  <span>🔴 En vivo</span>
  <span>⏳ Pendiente</span>
  <span>🚫 Pospuesto</span>
</div>

<div class="card" id="games-card">
  <div class="card-title">📋 Partidos</div>
  <div id="games-list"></div>
</div>

<div class="card" id="stats-card">
  <div class="card-title">📊 Rendimiento</div>
  <div class="stat-grid" id="stats-list"></div>
</div>

<div style="text-align:center;font-size:12px;color:#e1e8ed;margin-top:8px">⏳ Los datos se actualizan automáticamente</div>

<div class="footer">MLB Bot — Análisis académico</div>

<script>
const DATA = {
  "fecha": "28/05/2026 21:41",
  "games": [
    {
      "status_emoji": "✅",
      "fav_team": "Toronto Blue Jays",
      "opp_team": "Baltimore Orioles",
      "score_fav": "2",
      "score_opp": "1",
      "state": "Final",
      "result": "win",
      "label": "🎯"
    },
    {
      "status_emoji": "❌",
      "fav_team": "Pittsburgh Pirates",
      "opp_team": "Chicago Cubs",
      "score_fav": "2",
      "score_opp": "7",
      "state": "Final",
      "result": "loss",
      "label": "📊"
    },
    {
      "status_emoji": "❌",
      "fav_team": "Detroit Tigers",
      "opp_team": "Los Angeles Angels",
      "score_fav": "1",
      "score_opp": "7",
      "state": "Final",
      "result": "loss",
      "label": "📊"
    },
    {
      "status_emoji": "✅",
      "fav_team": "Atlanta Braves",
      "opp_team": "Boston Red Sox",
      "score_fav": "10",
      "score_opp": "2",
      "state": "Final",
      "result": "win",
      "label": "📊"
    },
    {
      "status_emoji": "✅",
      "fav_team": "Chicago White Sox",
      "opp_team": "Minnesota Twins",
      "score_fav": "6",
      "score_opp": "2",
      "state": "Final",
      "result": "win",
      "label": "📊"
    },
    {
      "status_emoji": "⏳",
      "fav_team": "Texas Rangers",
      "opp_team": "Houston Astros",
      "score_fav": "—",
      "score_opp": "",
      "state": "Pend.",
      "result": "pending",
      "label": "📋"
    },
    {
      "status_emoji": "⏳",
      "fav_team": "Los Angeles Dodgers",
      "opp_team": "Colorado Rockies",
      "score_fav": "—",
      "score_opp": "",
      "state": "Pend.",
      "result": "pending",
      "label": "📊"
    },
    {
      "status_emoji": "❌",
      "fav_team": "Texas Rangers",
      "opp_team": "Houston Astros",
      "score_fav": "1",
      "score_opp": "5",
      "state": "Final",
      "result": "loss",
      "label": "📊"
    }
  ],
  "bot_username": "ApuestasAP_Bot",
  "autorizados": [
    123456789
  ],
  "stats": {
    "total": 58,
    "acertados": 33,
    "fallidos": 25,
    "win_rate": 56.9,
    "alta_total": 13,
    "alta_acertados": 9,
    "alta_fallidos": 4,
    "alta_win_rate": 69.2,
    "media_total": 15,
    "media_acertados": 11,
    "media_fallidos": 4,
    "media_win_rate": 73.3,
    "baja_total": 30,
    "baja_acertados": 13,
    "baja_fallidos": 17,
    "baja_win_rate": 43.3,
    "valor_ok": 0,
    "valor_total": 0,
    "valor_rate": 0
  }
};

// ── Control de acceso ──────────────────────────────────────────────
(function() {
  const tg = window.Telegram?.WebApp;
  const userId = tg?.initDataUnsafe?.user?.id;
  const autorizados = DATA.autorizados || [];
  const acceso = userId && autorizados.includes(userId);

  if (!acceso) {
    document.body.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:90vh;padding:32px;text-align:center">'
      + '<div style="font-size:48px;margin-bottom:16px">🔒</div>'
      + '<h2 style="font-size:18px;margin-bottom:8px;color:#e1e8ed">Acceso Restringido</h2>'
      + '<p style="font-size:14px;color:#8b98a5;margin-bottom:24px;line-height:1.5">Esta aplicación es de uso exclusivo para suscriptores del plan mensual MLB Bot.</p>'
      + '<div style="background:#1d9bf0;color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;font-weight:600">'
      + 'Contacta a @' + (DATA.bot_username || 'admin') + ' para contratar</div>'
      + '<div style="margin-top:24px;font-size:11px;color:#536471">Tu ID: ' + (userId || 'No disponible') + '</div>'
      + '</div>';
    return;
  }
})();

function render() {
  document.getElementById('fecha').textContent = DATA.fecha || '—';

  // Games
  function renderGameRow(g) {
    const score = g.score_fav !== '—' && g.score_opp !== ''
      ? g.score_fav + '-' + g.score_opp
      : '';
    const sep = score ? score : 'Vs';
    let teamHtml;
    if (g.label === '🎯') {
      teamHtml = '<span style="font-weight:700;color:#f5a623">' + g.fav_team + '</span>'
        + ' <span style="color:#8b98a5">' + sep + '</span> <span style="color:#8b98a5">' + g.opp_team + '</span>';
    } else if (g.label === '📊') {
      teamHtml = '<span style="font-weight:600;color:#ffd866">' + g.fav_team + '</span>'
        + ' <span style="color:#8b98a5">' + sep + '</span> <span style="color:#8b98a5">' + g.opp_team + '</span>';
    } else {
      teamHtml = g.fav_team + ' ' + sep + ' ' + g.opp_team;
    }
    return '<div class="game-row">'
      + '<div class="game-status">' + g.status_emoji + '</div>'
      + '<div class="game-team">' + teamHtml + '</div>'
      + '<div class="game-state">' + g.state + '</div>'
      + '</div>';
  }
  const gamesEl = document.getElementById('games-list');
  if (!DATA.games || DATA.games.length === 0) {
    gamesEl.innerHTML = '<div class="game-row" style="color:#71767b;justify-content:center">Sin partidos</div>';
  } else {
    const recs  = DATA.games.filter(g => g.label === '🎯');
    const meds  = DATA.games.filter(g => g.label === '📊');
    const infos = DATA.games.filter(g => g.label === '📋');
    let html = '';
    if (recs.length > 0) {
      html += '<div style="font-size:11px;font-weight:600;color:#f5a623;padding:6px 0 3px 0;border-bottom:1px solid #2f3336;margin-bottom:2px">🎯 RECOMENDADAS</div>';
      html += recs.map(renderGameRow).join('');
    }
    if (meds.length > 0) {
      html += '<div style="font-size:11px;font-weight:600;color:#8b98a5;padding:6px 0 3px 0;border-bottom:1px solid #2f3336;margin:4px 0 2px 0">📊 CONFIANZA MEDIA</div>';
      html += meds.map(renderGameRow).join('');
    }
    if (infos.length > 0) {
      html += '<div style="font-size:11px;font-weight:600;color:#8b98a5;padding:6px 0 3px 0;border-bottom:1px solid #2f3336;margin:4px 0 2px 0">📋 SOLO INFORMATIVOS</div>';
      html += infos.map(renderGameRow).join('');
    }
    gamesEl.innerHTML = html;
  }

  // Stats
  const statsEl = document.getElementById('stats-list');
  if (!DATA.stats) return;
  const s = DATA.stats;
  statsEl.innerHTML = '';
  const stats = [
    { label: '🌐 Global', value: `${s.acertados}✅ ${s.fallidos}❌`, sub: `(${s.total}) ${s.win_rate}%` },
    { label: '🎯 Recomendadas', value: `${s.alta_acertados}✅ ${s.alta_fallidos}❌`, sub: `(${s.alta_total}) ${s.alta_win_rate}%`, fire: s.alta_win_rate >= 65 },
    { label: '📊 Conf. Media', value: `${s.media_acertados}✅ ${s.media_fallidos}❌`, sub: `(${s.media_total}) ${s.media_win_rate}%` },
    { label: '📋 Solo Inform.', value: `${s.baja_acertados}✅ ${s.baja_fallidos}❌`, sub: `(${s.baja_total}) ${s.baja_win_rate}%` },
    { label: '⭐ Señales Valor', value: `${s.valor_ok}/${s.valor_total}`, sub: `${s.valor_rate}%` },
  ];
  stats.forEach(st => {
    if (!st.sub.startsWith('(0)') || st.label === '🌐 Global') {
      statsEl.innerHTML += `<div class="stat-item">
        <span class="stat-label">${st.label}</span>
        <span class="stat-value">${st.value} <span class="stat-sub">${st.sub}</span>${st.fire ? '<span class="fire">🔥</span>' : ''}</span>
      </div>`;
    }
  });
}

render();

// Auto-refresh cada 90s
setTimeout(function(){ location.reload(); }, 300000);
</script>
</body>
</html>
